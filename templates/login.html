<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – SR University Academic Performance Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo svg { width: 56px; height: 56px; }
    h1 { color: #fff; font-size: 1.8rem; text-align: center; margin-bottom: 8px; }
    .subtitle { color: rgba(255,255,255,0.5); text-align: center; font-size: 0.9rem; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 8px; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #667eea; }
    input::placeholder { color: rgba(255,255,255,0.3); }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .link-row { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.5); font-size: 0.9rem; }
    .link-row a { color: #667eea; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .alert-error { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); color: #ff8080; }
    .alert-success { background: rgba(80,220,100,0.15); border: 1px solid rgba(80,220,100,0.3); color: #80e090; }
    .alert-info { background: rgba(100,180,255,0.15); border: 1px solid rgba(100,180,255,0.3); color: #90c8ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="28" r="28" fill="url(#lg)"/>
        <path d="M14 22l14-7 14 7-14 7-14-7z" fill="white" opacity="0.9"/>
        <path d="M42 22v9c0 4-6 8-14 8s-14-4-14-8v-9" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="56" y2="56"><stop stop-color="#667eea"/><stop offset="1" stop-color="#764ba2"/></linearGradient></defs>
      </svg>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">SR University Academic Performance Portal</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="student@sruniv.edu" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>
      <button class="btn" type="submit">Sign In</button>
    </form>

    <div style="margin-top: 24px; padding: 14px; background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px; font-size: 0.8rem; color: rgba(255,255,255,0.7);">
      <p style="font-weight: 600; margin-bottom: 6px; color: #a5b4fc;">⚡ Quick Demo Logins:</p>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;">
        <button type="button" onclick="document.getElementById('email').value='student@sruniv.edu'; document.getElementById('password').value='student123';" 
                style="padding: 4px 10px; background: rgba(99,102,241,0.25); border: 1px solid rgba(99,102,241,0.4); border-radius: 6px; color: #c7d2fe; cursor: pointer; font-size: 0.75rem;">
          👤 Student (student@sruniv.edu)
        </button>
        <button type="button" onclick="document.getElementById('email').value='advisor@sruniv.edu'; document.getElementById('password').value='advisor123';" 
                style="padding: 4px 10px; background: rgba(16,185,129,0.25); border: 1px solid rgba(16,185,129,0.4); border-radius: 6px; color: #a7f3d0; cursor: pointer; font-size: 0.75rem;">
          🎓 Advisor (advisor@sruniv.edu)
        </button>
      </div>
    </div>

    <div class="link-row">
      Don't have an account? <a href="/register">Register here</a>
    </div>
    <div class="link-row" style="margin-top:10px;">
      <a href="/">← Back to Home</a>
    </div>
  </div>
</body>
</html>
